name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

# One deployment at a time, never cancelled midway: a newer merge waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment's branch policy allows main only, and the deploy role trusts this environment only.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No dependency install scripts in a job that can request an AWS token.
      - run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/final-whistle-github-deploy
          aws-region: ${{ vars.AWS_REGION }}
      # Deploys the application stack only: the GitHub OIDC stack is deployed by hand (D23).
      - run: npm run deploy
